name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build release artifact
        run: npm run build:release
        env:
          CODESIGN_PUBLIC_REPOSITORY_URL: https://github.com/fmksites/codesign-webmcp

      - name: Verify browser bundle
        run: npm run verify:browser-bundle

      - name: Verify assembled judge site
        run: npm run check:judge-site

      - name: Check public boundary
        run: npm run check:public-boundary

      - name: Check documentation links
        run: npm run check:docs

      - name: Validate evaluation corpus
        run: npm run check:evals

      - name: Verify tote control parity
        run: npm run check:parity
